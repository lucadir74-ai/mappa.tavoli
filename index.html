<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavoli — stato foto</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#12151b; --panel:#1b1f28; --line:#2c313d; --txt:#e8eaef; --dim:#98a0b0;
    --v:#2fbf6b; --g:#f2c53d; --r:#e5484d; --mk:15px;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  header{flex:none;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .counts{display:flex;gap:6px;flex:1;min-width:190px}
  .c{flex:1;background:#161a22;border:1px solid var(--line);border-radius:9px;padding:5px 7px;line-height:1.15}
  .c b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .c span{font-size:10.5px;color:var(--dim)}
  .c.v b{color:var(--v)} .c.g b{color:var(--g)} .c.r b{color:var(--r)}
  .tools{display:flex;gap:6px;align-items:center}
  button{font:inherit;font-size:13px;color:var(--txt);background:#232936;border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;cursor:pointer}
  button:active{transform:translateY(1px)}
  button.on{background:#2f6fdb;border-color:#3b7ff0}
  .wrap{position:relative;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
  .stage{position:relative;width:100%}
  .stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .m{position:absolute;transform:translate(-50%,-50%);width:var(--mk);height:var(--mk);
    border-radius:4px;border:1.5px solid rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--mk)*.42);font-weight:800;color:#10141a;
    box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation}
  .stage.tiny .m{font-size:0;border-radius:50%;border-width:1px}
  .m.s0{background:var(--v)} .m.s1{background:var(--g)} .m.s2{background:var(--r)}
  .m.sel{outline:3px solid #57a8ff;outline-offset:2px}
  .bar{flex:none;z-index:20;background:var(--panel);border-top:1px solid var(--line);
    padding:7px 10px;font-size:12px;color:var(--dim);display:flex;gap:10px;align-items:center;justify-content:space-between}
  .legend{display:flex;gap:10px;flex-wrap:wrap}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
  #stato.ko{color:#f2a03d}
  .hint{background:#1d2a38;border:1px solid #3a4a5c;color:#cfe3f5;font-size:12px;padding:6px 10px;margin:0 10px 6px;border-radius:9px}
  dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:92vw}
  dialog h3{margin:0 0 10px;font-size:15px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  input{font:inherit;font-size:13px;background:#11141a;color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:9px;width:min(80vw,420px)}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
</style>
</head>

 {id:"M1",x:49.7,y:61.6},{id:"M2",x:53.9,y:61.6},{id:"M3",x:58.5,y:61.6},{id:"M4",x:62.3,y:61.6},{id:"M15",x:46.5,y:67.4}
];

function taglio(){                    // ultimo azzeramento automatico: le 6:00 di stamattina
  const ora = new Date(), c = new Date(ora);
  c.setHours(6,0,0,0);
  if(ora < c) c.setDate(c.getDate()-1);
  return c;
}
const scaduto = a => !a || new Date(a) < taglio();

const K_CFG="tavoli.cfg", K_CACHE="tavoli.cache", K_QUEUE="tavoli.queue";
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let cfg = ls.get(K_CFG) || {url:SUPABASE_URL, key:SUPABASE_KEY};
if(SUPABASE_URL && SUPABASE_KEY) cfg = {url:SUPABASE_URL, key:SUPABASE_KEY};

let tables = (ls.get(K_CACHE) || TAVOLI.map(t=>({...t, s:0})));
tables.forEach(t=>{ if(scaduto(t.agg)) t.s = 0; });
let queue  = ls.get(K_QUEUE) || [];
let editing=false, adding=false, sel=null, zoom=1, online=false;

const stage=document.getElementById("stage"), wrap=document.getElementById("wrap"), hint=document.getElementById("hint");

/* ─── disegno ─── */
function draw(){
  [...stage.querySelectorAll(".m")].forEach(e=>e.remove());
  tables.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="m s"+t.s+(sel===i?" sel":"");
    d.style.left=t.x+"%"; d.style.top=t.y+"%";
    d.textContent=t.id; d.dataset.i=i;
    stage.appendChild(d);
  });
  counts();
}
function counts(){
  const c=[0,0,0]; tables.forEach(t=>c[t.s]++);
  n0.textContent=c[0]; n1.textContent=c[1]; n2.textContent=c[2];
}
function stato(txt, ko){ const e=document.getElementById("stato"); e.textContent=txt; e.classList.toggle("ko", !!ko); }

/* ─── cloud ─── */
function api(path, opts={}){
  if(!cfg.url || !cfg.key) return Promise.reject(new Error("no-cfg"));
  return fetch(cfg.url.replace(/\/$/,"")+"/rest/v1/"+path, {
    ...opts,
    headers:{ apikey:cfg.key, Authorization:"Bearer "+cfg.key,
      "Content-Type":"application/json", ...(opts.headers||{}) }
  });
}
function enqueue(row){
  row.aggiornato = new Date().toISOString();
  queue = queue.filter(q=>q.codice!==row.codice).concat([row]);
  ls.set(K_QUEUE, queue);
  flush();
}
async function flush(){
  if(!queue.length) return true;
  try{
    const r = await api("tavoli", {method:"POST", headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify(queue)});
    if(!r.ok) throw new Error(await r.text());
    queue = []; ls.set(K_QUEUE, queue);
    return true;
  }catch(e){ return false; }
}
async function pull(){
  try{
    const r = await api("tavoli?select=codice,stato,x,y,aggiornato");
    if(!r.ok) throw new Error(await r.text());
    const rows = await r.json();
    if(!rows.length){ await seed(); return; }
    const pend = new Set(queue.map(q=>q.codice));
    const map = new Map(tables.map(t=>[t.id,t]));
    rows.forEach(row=>{
      if(pend.has(row.codice)) return;
      const t = map.get(row.codice);
      const st = scaduto(row.aggiornato) ? 0 : row.stato;
      if(t){ t.s = st; t.agg = row.aggiornato; if(row.x!=null) t.x=row.x; if(row.y!=null) t.y=row.y; }
      else tables.push({id:row.codice, x:row.x??50, y:row.y??50, s:st, agg:row.aggiornato});
    });
    ls.set(K_CACHE, tables);
    online = true; draw();
    stato("aggiornato " + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}));
    await flush();
  }catch(e){
    online = false;
    stato(queue.length ? "offline — "+queue.length+" da inviare" : "offline", true);
  }
}
async function seed(){
  const now = new Date().toISOString();
  const rows = tables.map(t=>({codice:t.id, stato:t.s, x:t.x, y:t.y, aggiornato:now}));
  try{
    const r = await api("tavoli", {method:"POST", headers:{Prefer:"resolution=merge-duplicates"}, body:JSON.stringify(rows)});
    if(r.ok){ online=true; stato("mappa creata sul cloud"); }
  }catch(e){}
}

/* ─── tocco ─── */
stage.addEventListener("click", e=>{
  const m = e.target.closest(".m");
  const r = stage.getBoundingClientRect();
  const px = +(((e.clientX-r.left)/r.width)*100).toFixed(2);
  const py = +(((e.clientY-r.top)/r.height)*100).toFixed(2);

  if(adding){
    const id = prompt("Sigla del tavolo (es. S3)");
    if(id){ tables.push({id:id.trim().toUpperCase(), x:px, y:py, s:0});
      const t=tables[tables.length-1];
      ls.set(K_CACHE,tables); draw(); enqueue({codice:t.id, stato:0, x:t.x, y:t.y}); }
    adding=false; hint.textContent="Sposta: tocca un tavolo, poi tocca il punto giusto."; return;
  }
  if(editing){
    if(m){ sel=+m.dataset.i; draw(); return; }
    if(sel===null) return;
    const t = tables[sel]; t.x=px; t.y=py;
    ls.set(K_CACHE,tables); draw(); enqueue({codice:t.id, stato:t.s, x:t.x, y:t.y});
    return;
  }
  if(!m) return;
  const t = tables[+m.dataset.i];
  t.s = (t.s+1)%3;
  m.className = "m s"+t.s;
  counts(); ls.set(K_CACHE,tables);
  enqueue({codice:t.id, stato:t.s, x:t.x, y:t.y});
});

/* ─── zoom ─── */
function setZoom(z, ax, ay){
  const r = wrap.getBoundingClientRect();
  const px = (ax==null ? r.width/2 : ax-r.left), py = (ay==null ? r.height/2 : ay-r.top);
  const fx = (wrap.scrollLeft+px)/(r.width*zoom), fy = (wrap.scrollTop+py)/(stage.clientHeight||1);
  zoom = Math.min(6, Math.max(1, Math.round(z*100)/100));
  stage.style.width = (100*zoom)+"%";
  document.documentElement.style.setProperty("--mk", Math.round(15*zoom)+"px");
  stage.classList.toggle("tiny", 15*zoom < 17);
  const h = stage.clientHeight;
  wrap.scrollLeft = fx*(r.width*zoom)-px; wrap.scrollTop = fy*h-py;
}
zin.onclick=()=>setZoom(zoom+0.5); zout.onclick=()=>setZoom(zoom-0.5);
let pz=0, pd=0;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
wrap.addEventListener("touchstart", e=>{ if(e.touches.length===2){ pz=zoom; pd=dist(e.touches); } }, {passive:true});
wrap.addEventListener("touchmove", e=>{
  if(e.touches.length===2 && pd>0){ e.preventDefault();
    setZoom(pz*dist(e.touches)/pd, (e.touches[0].clientX+e.touches[1].clientX)/2, (e.touches[0].clientY+e.touches[1].clientY)/2); }
}, {passive:false});
wrap.addEventListener("touchend", ()=>{ pd=0; }, {passive:true});
wrap.addEventListener("wheel", e=>{ if(!e.ctrlKey) return; e.preventDefault();
  setZoom(zoom*(e.deltaY<0?1.12:0.89), e.clientX, e.clientY); }, {passive:false});

/* ─── comandi ─── */
document.getElementById("edit").onclick = e=>{
  editing=!editing; adding=false; sel=null;
  e.target.classList.toggle("on", editing);
  hint.hidden=!editing;
  hint.textContent="Sposta: tocca un tavolo, poi tocca il punto giusto. Lo spostamento lo vedono tutti.";
  draw();
};
const dlg=document.getElementById("dlg"), cfgDlg=document.getElementById("cfgDlg");
document.getElementById("menu").onclick=()=>{
  document.getElementById("ultimo").textContent = (cfg.url ? "Collegato a "+cfg.url.replace(/^https?:\/\//,"") : "Non collegato al cloud.") + " I tavoli tornano verdi da soli ogni mattina alle 6:00.";
  dlg.showModal();
};
document.getElementById("close").onclick=()=>dlg.close();
document.getElementById("reset").onclick=async ()=>{
  if(!confirm("Rimettere tutti i tavoli verdi? Vale per tutti i fotografi.")) return;
  tables.forEach(t=>t.s=0); ls.set(K_CACHE,tables); draw(); dlg.close();
  try{ await api("tavoli?stato=gte.0",{method:"PATCH", body:JSON.stringify({stato:0})}); stato("azzerato per tutti"); }
  catch(e){ tables.forEach(t=>enqueue({codice:t.id, stato:0, x:t.x, y:t.y})); }
};
document.getElementById("add").onclick=()=>{
  adding=true; editing=true; sel=null; dlg.close();
  document.getElementById("edit").classList.add("on");
  hint.hidden=false; hint.textContent="Tocca il punto della mappa dove aggiungere il tavolo.";
};
document.getElementById("cfgBtn").onclick=()=>{
  cfgUrl.value=cfg.url||""; cfgKey.value=cfg.key||""; dlg.close(); cfgDlg.showModal();
};
document.getElementById("cfgClose").onclick=()=>cfgDlg.close();
document.getElementById("cfgSave").onclick=()=>{
  cfg={url:cfgUrl.value.trim(), key:cfgKey.value.trim()};
  ls.set(K_CFG,cfg); cfgDlg.close(); pull();
};

/* ─── avvio ─── */
draw(); setZoom(1);
if(cfg.url && cfg.key){ pull(); setInterval(()=>{ if(!document.hidden) pull(); }, 5000); }
else stato("non collegato — apri ••• › Collegamento cloud", true);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && cfg.url) pull(); });
</script>
</body>
